version: '3.8'

services:
  # 1. The Message Broker (Official Apache Kafka in KRaft mode)
  kafka:
    image: apache/kafka:latest
    ports:
      - "9094:9094" # Exposed to your host machine for the game client
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Required for a single-node setup

  # 2. Kafka UI Dashboard
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  # 3. MongoDB (State Storage)
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  # 4. The Brain Engine
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # No ports exposed needed, workers talk to it internally

  # 5. The AI Workers (5 Brains)
  ai-workers:
    build: ./worker/
    depends_on:
      - kafka
      - mongodb
      - ollama
    deploy:
      replicas: 5 # This magically spins up 5 concurrent workers!

volumes:
  ollama_data: